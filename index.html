<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>n8n Agent Prompt Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css" />

  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #252526;
      --panel-border: #343434;
      --text: #d4d4d4;
      --muted: #9da3ae;
      --expr: #4fc1ff;
      --expr-bg: rgba(79, 193, 255, 0.1);
      --keyword: #ffd166;
      --error: #ff6b6b;
      --ok: #2dd4bf;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Fira Code", Consolas, "Courier New", monospace;
    }

    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--panel-border);
      background: var(--panel);
      font-size: 14px;
      letter-spacing: 0.2px;
    }

    .topbar-title { font-weight: 500; }

    .topbar-status {
      color: var(--muted);
      font-size: 12px;
    }

    .editor-shell {
      flex: 1;
      min-height: 0;
      border: 2px solid transparent;
      transition: border-color .15s ease;
    }

    .editor-shell.invalid {
      border-color: var(--error);
      box-shadow: inset 0 0 0 1px rgba(255, 107, 107, 0.25);
    }

    .CodeMirror {
      height: 100%;
      font-size: 15px;
      line-height: 1.55;
      background: var(--bg);
      color: var(--text);
      padding: 12px 0;
    }

    .CodeMirror-gutters {
      background: var(--bg);
      border-right: 1px solid #2f2f2f;
    }

    .CodeMirror-linenumber {
      color: #5f6570;
    }

    .CodeMirror-cursor { border-left: 2px solid #f5f5f5; }

    .cm-n8n-expression { color: var(--expr); background: var(--expr-bg); }
    .cm-n8n-delimiter { color: #67e8f9; font-weight: 600; }
    .cm-n8n-keyword { color: var(--keyword); font-weight: 600; }

    .footer {
      height: 36px;
      background: var(--panel);
      border-top: 1px solid var(--panel-border);
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
    }

    .footer-right {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .token-count { color: #d1d5db; }
    .validation-ok { color: var(--ok); }
    .validation-error { color: var(--error); }

    .CodeMirror-hints {
      font-family: "Fira Code", Consolas, "Courier New", monospace;
      font-size: 12px;
      border: 1px solid var(--panel-border);
      background: #1a1a1a;
      color: var(--text);
    }

    .CodeMirror-hint-active {
      background: #0f3a52;
      color: #dff5ff;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="topbar-title">n8n Agent Prompt Editor</div>
      <div class="topbar-status">No-Build · HTML + CSS + Vanilla JS</div>
    </header>

    <section id="editor-shell" class="editor-shell">
      <textarea id="prompt-editor" placeholder="Escribe aquí tu prompt para agentes n8n..."></textarea>
    </section>

    <footer class="footer">
      <div id="char-count">Caracteres: 0</div>
      <div class="footer-right">
        <div id="validation-status" class="validation-ok">Expresiones n8n: OK</div>
        <div id="token-count" class="token-count">~Tokens: 0</div>
      </div>
    </footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>

  <script>
    const N8N_EXPR_REGEX = /\{\{[\s\S]*?\}\}/g;
    const N8N_KEYWORDS = ["$json", "$now", "$input", "$env", "function", "$items", "$node", "$workflow", "$vars"];
    const N8N_SNIPPETS = [
      "{{ $json }}",
      "{{ $json.campo }}",
      "{{ $now }}",
      "{{ $input.first().json }}",
      "{{ $env.MI_VARIABLE }}",
      "{{ function() { return $json; } }}"
    ];

    CodeMirror.defineMode("n8nPrompt", () => ({
      startState() {
        return { inExpr: false, inWord: false };
      },
      token(stream, state) {
        if (!state.inExpr) {
          if (stream.match("{{")) {
            state.inExpr = true;
            return "n8n-delimiter";
          }
          while (!stream.eol()) {
            if (stream.match("{{", false)) break;
            stream.next();
          }
          return null;
        }

        if (stream.match("}}")) {
          state.inExpr = false;
          return "n8n-delimiter";
        }

        if (stream.match(/\s+/)) {
          return "n8n-expression";
        }

        if (stream.match(/\$json|\$now|\$input|\$env|\$items|\$node|\$workflow|\$vars|function\b/)) {
          return "n8n-keyword";
        }

        stream.next();
        return "n8n-expression";
      }
    }));

    const editor = CodeMirror.fromTextArea(document.getElementById("prompt-editor"), {
      mode: "n8nPrompt",
      lineNumbers: true,
      lineWrapping: true,
      autofocus: true,
      viewportMargin: Infinity
    });

    const charCountEl = document.getElementById("char-count");
    const tokenCountEl = document.getElementById("token-count");
    const validationEl = document.getElementById("validation-status");
    const editorShell = document.getElementById("editor-shell");

    function estimateTokens(text) {
      return Math.ceil(text.length / 4);
    }

    function validateN8nExpressions(text) {
      const matchedExpressions = text.match(N8N_EXPR_REGEX) || [];
      const openCount = (text.match(/\{\{/g) || []).length;
      const closeCount = (text.match(/\}\}/g) || []).length;
      return { valid: openCount === closeCount, openCount, closeCount, matched: matchedExpressions.length };
    }

    function updateMetrics() {
      const text = editor.getValue();
      const chars = text.length;
      const tokens = estimateTokens(text);
      const validation = validateN8nExpressions(text);

      charCountEl.textContent = `Caracteres: ${chars}`;
      tokenCountEl.textContent = `~Tokens: ${tokens}`;

      if (validation.valid) {
        validationEl.className = "validation-ok";
        validationEl.textContent = `Expresiones n8n: OK (${validation.matched})`;
        editorShell.classList.remove("invalid");
      } else {
        validationEl.className = "validation-error";
        validationEl.textContent = `Error: {{ abiertos ${validation.openCount} / }} cerrados ${validation.closeCount}`;
        editorShell.classList.add("invalid");
      }
    }

    function n8nHint(cm) {
      const cursor = cm.getCursor();
      const token = cm.getTokenAt(cursor);
      const line = cm.getLine(cursor.line);
      const upToCursor = line.slice(0, cursor.ch);
      const exprStart = upToCursor.lastIndexOf("{{");
      const exprEnd = upToCursor.lastIndexOf("}}");

      if (exprStart === -1 || exprEnd > exprStart) return null;

      const fragment = upToCursor.slice(exprStart + 2).trim();
      const options = [...N8N_KEYWORDS, ...N8N_SNIPPETS]
        .filter(item => item.toLowerCase().includes(fragment.toLowerCase()))
        .slice(0, 8);

      if (!options.length) return null;

      return {
        list: options,
        from: CodeMirror.Pos(cursor.line, token.start),
        to: CodeMirror.Pos(cursor.line, cursor.ch)
      };
    }

    editor.on("inputRead", (cm, change) => {
      if (change.text.join("") === "{") {
        const cursor = cm.getCursor();
        const line = cm.getLine(cursor.line);
        const twoChars = line.slice(Math.max(0, cursor.ch - 2), cursor.ch);

        if (twoChars === "{{") {
          cm.showHint({ hint: n8nHint, completeSingle: false });
        }
      }
    });

    editor.on("cursorActivity", (cm) => {
      const line = cm.getLine(cm.getCursor().line);
      if (line.includes("{{")) {
        cm.showHint({ hint: n8nHint, completeSingle: false });
      }
    });

    editor.on("change", updateMetrics);

    editor.setValue(`Eres un agente de IA para n8n.\n\nContexto: {{ $json.contexto }}\nFecha actual: {{ $now }}\nEntrada principal: {{ $input.first().json }}\n\nResponde en español, de forma clara y accionable.`);
    updateMetrics();
  </script>
</body>
</html>
